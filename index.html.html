<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今夜の1本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--bg:#F1EDF5;--ink:#241B35;--mute:#6B6080;--card:#FFFFFF;--line:#D8CFE4;--acc:#D93A75;--on:#FFFFFF;--disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;--sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16111E;--ink:#EFE9F8;--mute:#A99EC0;--card:#231B30;--line:#3A2F4D;--acc:#FF7BA9;--on:#16111E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16111E;--ink:#EFE9F8;--mute:#A99EC0;--card:#231B30;--line:#3A2F4D;--acc:#FF7BA9;--on:#16111E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 var(--sans)}
main{max-width:30rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
h1{font:400 1rem/1.4 var(--disp);margin:0;color:var(--acc)}
.sub{margin:.2rem 0 0;color:var(--mute);font-size:.875rem}
.seg{display:flex;gap:.5rem;margin:1.5rem 0 0}
.seg button{flex:1;background:transparent;color:var(--ink);border:1px solid var(--line);font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#card{margin:1rem 0;padding:1.5rem 1.25rem;background:var(--card);border:1px solid var(--line);border-radius:.8rem;min-height:15rem}
#card.in{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#card.in{animation:none}}
.cover{display:block;width:8rem;max-width:50%;border-radius:.4rem;margin:0 0 1rem}
.meta{color:var(--mute);font-size:.875rem;margin:0}
.ttl{font:400 clamp(1.7rem,8.5vw,2.6rem)/1.3 var(--disp);margin:.5rem 0 .5rem;overflow-wrap:anywhere}
.bl{margin:.5rem 0 1rem}
.links{display:flex;gap:1.25rem;flex-wrap:wrap}
.empty{color:var(--mute);margin:3.5rem 0;text-align:center}
.err{color:var(--acc);margin:2rem 0}
a{color:var(--acc);font-weight:700}
button{font:700 1.05rem var(--sans);padding:.8rem 1.2rem;min-height:48px;border-radius:.5rem;border:1px solid transparent;background:var(--acc);color:var(--on);cursor:pointer}
#go{width:100%}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
footer{margin-top:2rem;color:var(--mute);font-size:.8rem}
</style>
</head>
<body>
<main>
<header><h1>今夜の1本</h1><p class="sub">アニメを1作品だけ、ランダムで表示します。</p></header>
<div class="seg" role="group" aria-label="対象">
  <button id="m-pop" aria-pressed="true">人気の中から</button>
  <button id="m-all" aria-pressed="false">全アニメから</button>
</div>
<section id="card" aria-live="polite"><p class="empty">まだ何も引いていません。</p></section>
<button id="go">ランダムで決める</button>
<footer>データ提供:AniList。人気の中からは、人気順の上位500作品が対象です。成人向けは除いています。</footer>
</main>
<script>
const Q=`query($page:Int,$sort:[MediaSort]){Page(page:$page,perPage:50){pageInfo{lastPage}media(type:ANIME,isAdult:false,sort:$sort){id title{native romaji}seasonYear format episodes genres coverImage{large}siteUrl}}}`;
const FM={TV:'TV',TV_SHORT:'短編TV',MOVIE:'映画',SPECIAL:'スペシャル',OVA:'OVA',ONA:'ONA',MUSIC:'ミュージックビデオ'};
const GJ={Action:'アクション',Adventure:'冒険',Comedy:'コメディ',Drama:'ドラマ',Fantasy:'ファンタジー',Horror:'ホラー','Mahou Shoujo':'魔法少女',Mecha:'ロボット',Music:'音楽',Mystery:'ミステリー',Psychological:'サイコ',Romance:'恋愛','Sci-Fi':'SF','Slice of Life':'日常',Sports:'スポーツ',Supernatural:'超常',Thriller:'スリラー',Ecchi:'お色気'};
const $=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n);
let mode='pop',lastPage=null;

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}
async function call(page,sort){
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:Q,variables:{page,sort}})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(j.errors)throw new Error(j.errors[0].message);
  return j.data.Page;
}
async function pick(){
  for(let k=0;k<3;k++){
    let p;
    if(mode==='pop')p=await call(1+rand(10),['POPULARITY_DESC']);
    else{
      if(!lastPage)lastPage=(await call(1,['ID'])).pageInfo.lastPage;
      p=await call(1+rand(lastPage),['ID']);
    }
    if(p.media.length)return p.media[rand(p.media.length)];
  }
  throw new Error('作品が取得できませんでした');
}
function show(a){
  const c=$('card');c.replaceChildren();
  const nat=a.title.native||a.title.romaji;
  if(a.coverImage&&a.coverImage.large){
    const im=el('img','cover');im.src=a.coverImage.large;im.alt='';im.loading='lazy';im.referrerPolicy='no-referrer';c.append(im);
  }
  c.append(el('p','meta',[FM[a.format]||a.format,a.seasonYear&&a.seasonYear+'年',a.episodes&&'全'+a.episodes+'話'].filter(Boolean).join('／')));
  c.append(el('h2','ttl',nat));
  if(a.title.romaji&&a.title.romaji!==nat)c.append(el('p','meta',a.title.romaji));
  c.append(el('p','bl',(a.genres||[]).map(g=>GJ[g]||g).join('、')));
  const l=el('div','links');
  if(a.siteUrl&&a.siteUrl.startsWith('https://anilist.co/')){const x=el('a','','AniListで詳細を見る');x.href=a.siteUrl;x.target='_blank';x.rel='noopener';l.append(x)}
  const s=el('a','','配信を調べる');s.href='https://www.google.com/search?q='+encodeURIComponent(nat+' アニメ 配信');s.target='_blank';s.rel='noopener';l.append(s);
  c.append(l);
  c.classList.remove('in');void c.offsetWidth;c.classList.add('in');
}
async function draw(){
  const b=$('go');b.disabled=true;b.textContent='取得中…';
  try{show(await pick());b.textContent='もう一回引く'}
  catch(e){
    const c=$('card');c.replaceChildren(el('p','err','取得できませんでした。通信状況か、APIの回数制限(1分あたり)のためかもしれません。少し待ってからもう一度お試しください。'));
    b.textContent='もう一回引く';
  }
  b.disabled=false;
}
function setMode(m){mode=m;$('m-pop').setAttribute('aria-pressed',m==='pop');$('m-all').setAttribute('aria-pressed',m==='all')}
$('m-pop').addEventListener('click',()=>setMode('pop'));
$('m-all').addEventListener('click',()=>setMode('all'));
$('go').addEventListener('click',draw);
</script>
</body>
</html>
